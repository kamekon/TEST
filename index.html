c pollution is primarily caused by the overfishing of marine resources and does not significantly impact the environment."}, "correct": "B"}, {"question": "What proportion of the world's natural gas comes from offshore deposits?", "options": {"A": "About one-third of the world's natural gas is sourced from coastal areas, such as continental shelves.", "B": "Around half of all oil resources are found in offshore deposits.", "C": "Around half of all natural gas comes from the sea.", "D": "A significant amount of natural gas is extracted from terrestrial sources rather than offshore deposits."}, "correct": "C"}, {"question": "What is the main reason that top predators, such as tuna, have smaller biomass compared to primary producers like phytoplankton in marine food chains?", "options": {"A": "Top predators rely solely on the energy provided by primary producers without any energy loss.", "B": "Approximately 90% of energy is lost as heat or waste at each trophic level.", "C": "Tuna and other top predators consume phytoplankton directly, which allows them to grow in abundance.", "D": "Top predators have smaller biomass because they require more energy than primary producers to survive."}, "correct": "B"}, {"question": "Oil Record Book is required by:", "options": {"A": "MARPOL convention", "B": "MARPOL Annex I", "C": "MARPOL Annex IV", "D": "MARPOL Annex V"}, "correct": "B"}, {"question": "Garbage Management Plan is required by:", "options": {"A": "MARPOL Annex II", "B": "MARPOL Annex I", "C": "MARPOL Annex IV", "D": "MARPOL Annex V"}, "correct": "D"}, {"question": "What must a ship possess in order to transport specific chemical cargoes safely?", "options": {"A": "A Certificate of Fitness that lists the products the ship is allowed to carry.", "B": "A license issued by the port authority that allows the ship to carry cargoes of any kind.", "C": "A general approval from the International Maritime Organization that covers all types of cargoes on board.", "D": "Once a shi They must carry a valid, certified Inventory of Hazardous Materials (IHM) on board.", "C": "All ships must have a special permit to enter any port in the EEA regardless of their size.", "D": "They must hold a certificate proving compliance with the Hong Kong Convention only if they are EU-flagged."}, "correct": "B"}, {"question": "Which cargo category poses an immediate safety assessment and containment requirement due to its hazardous nature?", "options": {"A": "Food products are hazardous and require immediate containment.", "B": "Automotive parts", "C": "Industrial chemicals", "D": "Consumer electronics"}, "correct": "C"}, {"question": "What is the primary reason sea turtles and seabirds ingest plastic materials?", "options": {"A": "They ingest plastic because they are unable to find any food in their environment.", "B": "They mistakenly identify plastic as their natural food, such as jellyfish and fish roe.", "C": "Marine animals consume plastic due to the presence of artificial chemicals in their natural habitats.", "D": "Sea turtles and seabirds eat plastic because they are attracted to its bright colors, not because they confuse it with food."}, "correct": "B"}, {"question": "What would most likely occur if shipping emissions continue to rise despite the implementation of MARPOL Annex VI's regulations?", "options": {"A": "Human health and ecosystems would face increasingly severe impacts due to worsening air quality and pollution.", "B": "Shipping emissions would eventually cause sudden, dramatic damage to coastal ecosystems, similar to major accidents.", "C": "Continued rising emissions would have no significant impact due to environmental resilience and adaptation mechanisms.", "D": "The effects of shipping emissions from ships can be easily noticed and addressed immediately after they occur."}, "correct": "A"}, {"question": "What determines the persistence and environmental impact of heavy petroleum products in marine ecosystems?", "options": {"A": "Heavy mmable", "D": "All hazardous chemicals are always toxic to humans"}, "correct": "A"}, {"question": "What can be inferred about the relationship between EEOI and the effectiveness of the SEEMP in maritime operations?", "options": {"A": "EEOI measures only the distance traveled by a ship without considering cargo capacity or fuel consumption.", "B": "EEOI is a critical indicator used to monitor the effectiveness of the SEEMP based on the fuel consumption of a ship during voyages.", "C": "EEOI is primarily used to determine the cargo capacity of a ship rather than its fuel efficiency during voyages.", "D": "The effectiveness of SEEMP is solely based on the number of crew members managing the ship's operations."}, "correct": "B"}, {"question": "What is the requirement for discharging food waste that has not been comminuted or ground from ships operating outside special areas?", "options": {"A": "It may be discharged while en route and not less than 12 nautical miles from the nearest land.", "B": "Food waste that has not been comminuted or ground can be discharged anywhere outside special areas without restrictions.", "C": "It may be discharged while en route as close as 6 nautical miles from the nearest land.", "D": "Discharging food waste is allowed at any distance from land as long as it is done at sea."}, "correct": "A"}, {"question": "The amount of sulfur oxides (oxides) SOx emitted by marine internal combustion engines depends on:", "options": {"A": "The Sulfur content in marine fuels", "B": "The lubricating oil type", "C": "The eco working operation mode", "D": "Improper engine operation"}, "correct": "A"}, {"question": "As per International Convention for Ballast Water Management, invasive species are:", "options": {"A": "Species at the top of the food chains", "B": "Which, finding a new habitat begin to mass reproduce and permanently inhabit the area and dislodge the local species", "C": "Organisms that can only be destroyed by chemical substances", "D": "Plankton destroying organisms"}, "correct": "B"}, {"question": "Which initial information is necessary for the effective assessment of a pollutant spill?", "options": {"A": "The only information needed is the name of the pollutant and its quantity.", "B": "Only incident details and pollutant information are necessary for effective assessment.", "C": "Initial assessment can be conducted without knowing the environmental conditions or vessel details.", "D": "Vessel details, incident details, pollutant information, environmental conditions, and resources at risk are essential initial information requirements."}, "correct": "D"}, {"question": "What significance does the Tubbataha Reefs Natural Park hold in terms of marine biodiversity and protection measures?", "options": {"A": "It serves primarily as a recreational site for tourists seeking to observe marine life and is protected through general fishing regulations.", "B": "It functions as a vital source of larvae and genetic material for surrounding marine regions and is designated as a PSSA to safeguard its ecological value.", "C": "It is an artificially created marine reserve with no natural significance, primarily used for commercial fishing activities.", "D": "It is an important fishing ground for local communities, promoting sustainable fishing practices for economic benefits."}, "correct": "B"}, {"question": "What constitutes black water as defined by MARPOL Annex IV in the context of marine pollution?", "options": {"A": "Sewage from industrial activities that is discharged into the sea.", "B": "Sewage from ships, including waste from toilets, urinals, medical facilities, and spaces with live animals.", "C": "Black water only includes clean water mixed with food waste from kitchens on ships.", "D": "Only sewage from toilets and urinals is considered black water as per MARPOL Annex IV."}, "correct": "B"}, {"question": "Under which conditions is the Treatment Rated Capacity (TRC) of a ballast water management system deemed adequate for a vessel's operations?", "options": {"A": "The TRC can be lower than the required volume as long as the system can treat some of the water during the ballasting process.", "B": "The TRC must always be equal to the total volume of water the vessel needs to ballast at once to be considered adequate.", "C": "If the TRC meets or exceeds the vessel's ballasting requirements, such as 2000 cubic meters per hour needed for filling, the system is adequate.", "D": "The TRC is solely determined by the size of the ballast water management system, irrespective of operational requirements."}, "correct": "C"}];

function createQuiz() {
    const quizContainer = document.getElementById("quiz");

    questions.forEach((q, index) => {
        const block = document.createElement("div");
        block.className = "question-block";

        const title = document.createElement("h3");
        title.textContent = (index + 1) + ". " + q.question;
        block.appendChild(title);

        for (let key in q.options) {
            const btn = document.createElement("div");
            btn.className = "option";
            btn.textContent = key + ": " + q.options[key];

            btn.onclick = function() {
                // если уже отвечал — не даём повторно
                if (block.classList.contains("answered")) return;

                block.classList.add("answered");

                if (key === q.correct) {
                    btn.classList.add("correct");
                } else {
                    btn.classList.add("wrong");

                    // подсветить правильный
                    const options = block.querySelectorAll(".option");
                    options.forEach(opt => {
                        if (opt.textContent.startsWith(q.correct)) {
                            opt.classList.add("correct");
                        }
                    });
                }
            };

            block.appendChild(btn);
        }

        quizContainer.appendChild(block);
    });
}

createQuiz();
